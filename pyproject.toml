[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "concordance"
version = "1.0.0"
description = "Automatic three-way matching of purchase orders, delivery notes and invoices (BC / BL / Facture) with a Vision-LLM extraction pipeline."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Mohsen Allani" }]
keywords = ["document-ai", "invoice-matching", "vision-llm", "fastapi", "opencv", "ocr"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
    # Pipeline L0 -> L9
    "google-genai",              # L3, L5: Vision-LLM (Gemini)
    "PyMuPDF>=1.24.3",                 # L0, L1: splitting, rendering, text density
    "opencv-python-headless",    # L2: scanned-page preprocessing
    "numpy",
    "python-dateutil",           # L6: date normalisation
    "pydantic>=2.14.4",
    "rapidfuzz",                 # L8: text similarity
    "weasyprint",                # L9: PDF report (needs Pango, see README)
    "jinja2",                    # L9: report templates
    # Persistence
    "SQLAlchemy>=2.0",
    "psycopg[binary]",
    "alembic",
    "python-dotenv",
    # Web application
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",          # PDF upload and OAuth2 form
    "PyJWT",                     # session tokens
    "bcrypt>=4.0",               # password hashing
]

[project.optional-dependencies]
# Local multilingual embeddings used as a semantic veto in L8 (heavy, optional).
semantic = ["sentence-transformers"]
dev = [
    "pytest>=8",
    "pytest-cov",
    "httpx",                     # FastAPI TestClient
    "ruff",
]

[project.scripts]
concordance = "concordance.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/concordance"]

[tool.hatch.build.targets.sdist]
include = ["src/concordance", "migrations", "alembic.ini", "tests", "docs", "samples/native_sample.pdf", "README.md", "pyproject.toml"]

# ------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # SQLite (used for tests only) has no native Decimal type.
    "ignore:Dialect sqlite.*does \\*not\\* support Decimal:sqlalchemy.exc.SAWarning",
]

# --------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = [
    "E501",   # line length is a guideline here, long French docstrings are fine
    "E741",   # `l` is used as a line variable throughout the comparison engine
    "B008",   # FastAPI idiom: Depends() in argument defaults
    "B904",   # exception chaining: user-facing errors deliberately drop the cause
    "B905",   # zip(strict=) : iterables are built together and always equal in length
]

[tool.ruff.lint.isort]
known-first-party = ["concordance"]
